# See https://wiki.hyprland.org/Configuring/Variables/

input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
    force_no_accel = 1
    numlock_by_default = true
}


exec-once='nohup easyeffects --gapplication-service &'

bind = Super, M, exec, ~/.config/hypr/scripts/rofiBeats.sh
